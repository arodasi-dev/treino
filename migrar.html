<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Migrar dados do Meu Treino</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:480px;margin:0 auto;padding:20px;background:#111;color:#eee}
  h1{font-size:20px} h2{font-size:15px;margin:22px 0 6px;color:#9cf}
  label{display:block;font-size:13px;margin:10px 0 4px;color:#bbb}
  input{width:100%;padding:10px;font-size:16px;border-radius:8px;border:1px solid #444;background:#222;color:#eee;box-sizing:border-box}
  button{margin-top:14px;padding:12px 16px;font-size:16px;border:0;border-radius:8px;background:#4a8cff;color:#fff;width:100%}
  button:disabled{opacity:.5}
  pre{background:#1b1b1b;border-radius:8px;padding:10px;font-size:12px;white-space:pre-wrap;min-height:60px}
  .ok{color:#6f6}.err{color:#f77}
  p{font-size:13px;color:#aaa;line-height:1.5}
</style>
</head>
<body>
<h1>Migrar do Firestore para o homeserver</h1>
<p>Copia seus treinos e histórico da conta Firebase para o servidor. Pode rodar mais de uma vez: ele só atualiza os mesmos itens, não duplica. <b>Nada é apagado do Firestore.</b></p>

<h2>1. Servidor (Tailscale ligado)</h2>
<label>Endereço</label><input id="url" type="url" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="https://homelab.tail69a525.ts.net:8447">
<label>Token</label><input id="token" type="password" autocapitalize="off" autocorrect="off" spellcheck="false">

<h2>2. Sua conta atual do app</h2>
<label>E-mail</label><input id="email" type="email" autocapitalize="off" autocomplete="username">
<label>Senha</label><input id="pass" type="password" autocomplete="current-password">

<button id="go">Migrar agora</button>
<h2>Resultado</h2>
<pre id="log">Aguardando…</pre>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
const COLS = ['workouts', 'sessions', 'drafts', 'meta'];
const $ = id => document.getElementById(id);
const log = (t, cls) => { const l = $('log'); l.innerHTML += '\n<span class="' + (cls||'') + '">' + t.replace(/</g,'&lt;') + '</span>'; };
try{ const c = JSON.parse(localStorage.getItem('treino.server') || '{}'); if(c.url) $('url').value = c.url; if(c.token) $('token').value = c.token; }catch(e){}

$('go').onclick = async () => {
  const base = $('url').value.trim().replace(/\/+$/, ''), token = $('token').value.trim();
  const email = $('email').value.trim().toLowerCase(), pass = $('pass').value;
  if(!base || !token || !email || !pass){ $('log').textContent = 'Preencha tudo.'; return; }
  $('go').disabled = true; $('log').textContent = 'Começando…';
  const H = { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' };
  try{
    log('Conferindo o servidor…');
    let r = await fetch(base + '/api/c/meta', { headers: H });
    if(r.status === 401) throw new Error('Token incorreto.');
    if(!r.ok) throw new Error('Servidor respondeu ' + r.status);
    log('Servidor ok.', 'ok');

    log('Entrando no Firebase…');
    if(!firebase.apps.length) firebase.initializeApp(window.firebaseConfig);
    const cred = await firebase.auth().signInWithEmailAndPassword(email, pass);
    const uid = cred.user.uid;
    log('Login ok.', 'ok');

    const payload = {}, expected = {};
    for(const col of COLS){
      const snap = await firebase.firestore().collection('users').doc(uid).collection(col).get();
      payload[col] = snap.docs.map(d => { const v = d.data(); if(!v.id) v.id = d.id; return v; });
      expected[col] = payload[col].length;
      log('Lidos do Firestore — ' + col + ': ' + expected[col]);
    }

    log('Enviando para o servidor…');
    r = await fetch(base + '/api/import', { method: 'POST', headers: H, body: JSON.stringify(payload) });
    if(!r.ok) throw new Error('Importação falhou: ' + r.status + ' ' + await r.text());

    log('Conferindo o que chegou…');
    r = await fetch(base + '/api/export', { headers: H });
    const got = await r.json();
    let allOk = true;
    for(const col of COLS){
      const n = (got[col] || []).length, ok = n >= expected[col];
      if(!ok) allOk = false;
      log(col + ': ' + n + ' no servidor (esperado ' + expected[col] + ')', ok ? 'ok' : 'err');
    }
    log(allOk ? '\nPronto! Tudo foi copiado. Agora abra o app e conecte ao servidor.' : '\nAlgo ficou faltando. Rode de novo ou me avise.', allOk ? 'ok' : 'err');
    try{ await firebase.auth().signOut(); }catch(e){}
  }catch(e){
    log('\nErro: ' + (e.code || e.message), 'err');
  }
  $('go').disabled = false;
};
</script>
</body>
</html>
