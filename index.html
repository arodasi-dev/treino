<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Meu Treino</title>
<meta name="description" content="App pessoal de treino de academia">

<!-- PWA / iOS -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F8F9FA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Treino">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=48">
<link rel="icon" href="icon-192.png?v=48">

<!-- Fontes divertidas -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<script>
  window.__HTMLBUILD='h16';  /* carimbo do index.html — serve pra saber se o shell atualizou no iPhone */
  (function(){
    var r=document.documentElement;
    function vh(){ return (window.visualViewport && window.visualViewport.height) || window.innerHeight || 0; }
    function setH(){ var v=vh(); if(v) r.style.setProperty('--app-h', v+'px'); }
    setH();
    // iOS demora pra "assentar" a altura real ao abrir: re-mede várias vezes nos primeiros instantes
    [0,1,16,40,80,150,300,600,1000].forEach(function(t){ setTimeout(setH,t); });
    if(window.requestAnimationFrame){ requestAnimationFrame(function(){ setH(); requestAnimationFrame(setH); }); }
    addEventListener('resize', setH);
    addEventListener('orientationchange', function(){ setTimeout(setH,200); setTimeout(setH,500); });
    addEventListener('pageshow', setH);
    addEventListener('load', setH);
    addEventListener('focus', setH);
    document.addEventListener('visibilitychange', function(){ if(!document.hidden){ setH(); setTimeout(setH,150); } });
    if(window.visualViewport){
      window.visualViewport.addEventListener('resize', setH);
      window.visualViewport.addEventListener('scroll', setH);
    }
  })();

  /* Mata o ZOOM do iOS (pinça e duplo-toque) que empurrava e travava a tela.
     touch-action já ajuda; isto cobre os casos que o iOS ignora. */
  (function(){
    document.addEventListener('gesturestart', function(e){ e.preventDefault(); }, {passive:false});
    document.addEventListener('gesturechange', function(e){ e.preventDefault(); }, {passive:false});
    document.addEventListener('gestureend', function(e){ e.preventDefault(); }, {passive:false});
    var last=0, lx=0, ly=0;
    document.addEventListener('touchend', function(e){
      var now=Date.now();
      var t=e.changedTouches&&e.changedTouches[0];
      var x=t?t.clientX:0, y=t?t.clientY:0;
      if(now-last<=350 && Math.abs(x-lx)<40 && Math.abs(y-ly)<40){ e.preventDefault(); }  /* 2 toques juntos = zoom, cancela */
      last=now; lx=x; ly=y;
    }, {passive:false});
  })();
</script>

<style>
/* ============ Design tokens ============
   Layout: app full-screen, header fixo em cima, nav fixa embaixo, conteúdo rola no meio.
   Paleta divertida: creme + roxo vibrante (acento) + periwinkle + oliva (feito). */
:root{
  --bg:#F4FAFF; --surface:#DEE7E7; --surface-2:#CEDADA;
  --gate-bg:#F4FAFF;   /* fundo do login — independente do app */
  --fg:#535657; --muted:#4F646F; --line:#C7D2D2;
  --accent:#B7ADCF; --accent-fg:#3A3647; --accent-soft:#E7E3F0;
  --accent2:#8F82B4; --accent2-fg:#FFFFFF; --accent2-soft:#E7E3F0;
  --ok:#B7ADCF; --ok-fg:#3A3647; --ok-soft:#E7E3F0;
  --danger:#C85A6B; --danger-soft:#F3E0E3;
  --radius:20px; --radius-sm:14px;
  --shadow:none;
  --header-h:56px; --nav-h:58px;
  --nav-pad:6px;
  --font:'Rubik', -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --font-display:'Rubik', -apple-system, system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#535657; --surface:#4F646F; --surface-2:#455862;
    --gate-bg:#535657;   /* fundo do login = mesmo do bg do app */
    --fg:#F4FAFF; --muted:#DEE7E7; --line:#5E7681;
    --accent:#B7ADCF; --accent-fg:#3A3647; --accent-soft:#5B5568;
    --accent2:#C9BFE3; --accent2-fg:#3A3647; --accent2-soft:#5B5568;
    --ok:#B7ADCF; --ok-fg:#3A3647; --ok-soft:#5B5568;
    --danger:#E88A96; --danger-soft:#5A3A40;
    --shadow:none;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#535657; --surface:#4F646F; --surface-2:#455862;
  --gate-bg:#535657;
  --fg:#F4FAFF; --muted:#DEE7E7; --line:#5E7681;
  --accent:#B7ADCF; --accent-fg:#3A3647; --accent-soft:#5B5568;
  --accent2:#C9BFE3; --accent2-fg:#3A3647; --accent2-soft:#5B5568;
  --ok:#B7ADCF; --ok-fg:#3A3647; --ok-soft:#5B5568;
  --danger:#E88A96; --danger-soft:#5A3A40;
  --shadow:none;
  color-scheme: dark;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
/* html/body recebem a cor do MENU (surface): a faixa da barrinha do home no app
   fica da mesma cor do menu. No login, o #gate transborda com --bg por cima. */
html{height:100%;margin:0;background:var(--surface);overflow:hidden;overscroll-behavior:none}
html.on-gate, html.on-gate body{background:var(--gate-bg)}   /* no login, html E body ficam da cor do login (a faixa de baixo mostra o body) */
body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;position:fixed;inset:0;width:100%}
body{
  font-family:var(--font); background:var(--surface); color:var(--fg);
  -webkit-font-smoothing:antialiased; font-size:16px; line-height:1.45;
  overscroll-behavior-y:none;
  touch-action:manipulation;              /* mata o double-tap-zoom do iOS (que travava a tela) */
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;  /* sem lupa/seleção no toque duplo */
}
input,textarea,select,[contenteditable]{ -webkit-user-select:text; user-select:text; }
*{touch-action:manipulation}   /* mata o double-tap-zoom em QUALQUER elemento (inclusive barras do gráfico) */
button{font-family:inherit;font-size:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:16px}
h1,h2,h3{margin:0;text-wrap:balance;font-family:var(--font-display);letter-spacing:.01em}

#app{
  position:fixed; top:0; right:0; left:0; bottom:0;
  height:100dvh;  /* tela visível (848). a barrinha do home fica SOBRE os 34px de baixo, não além — somar safe cortava o menu */
  display:flex; flex-direction:column;
  max-width:560px; margin:0 auto; background:transparent;
}

/* ---- Header ---- */
header{
  flex:0 0 auto; display:flex; align-items:center; gap:10px;
  padding:0 16px; padding-top:env(safe-area-inset-top,0px);
  height:calc(var(--header-h) + env(safe-area-inset-top,0px));
  background:var(--surface); border-bottom:1px solid var(--line);
  position:sticky; top:0; z-index:20;
}
header .title{font-size:20px;font-weight:600;font-family:var(--font-display);letter-spacing:0;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header .back{background:none;border:none;color:var(--accent);font-weight:600;
  display:flex;align-items:center;gap:4px;padding:8px 4px;margin-left:-4px}
.icon-btn{background:var(--surface-2);border:none;color:var(--fg);width:38px;height:38px;
  border-radius:50%;display:grid;place-items:center;font-size:18px}

/* ---- Content ---- */
main{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:none;background:var(--bg);
  padding:16px; padding-bottom:88px}
.view{display:none;animation:fade .18s ease}
.view.active{display:block}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* ---- Nav ---- */
nav{
  position:relative;
  flex:0 0 auto; display:flex; align-items:flex-end; background:var(--surface); border-top:1px solid var(--line);
  padding-top:18px; padding-bottom:6px;   /* mais espaço em cima + pouco embaixo = ícones mais pra baixo */
}
nav button{flex:1;background:none;border:none;color:var(--muted);
  display:flex;align-items:flex-end;justify-content:center;
  padding:0;margin:0 4px;border-radius:14px;
  transition:color .15s ease, transform .15s ease}
nav button:active{transform:scale(.88)}
nav button i{font-size:25px;line-height:1;display:flex;align-items:center;justify-content:center}
nav button.active{color:var(--accent)}
/* barrinha deslizante no topo do menu — some pra cima do ícone ativo */
.nav-ind{position:absolute;top:0;left:-40px;width:30px;height:4px;border-radius:0 0 4px 4px;
  background:var(--accent);transition:left .28s cubic-bezier(.4,0,.2,1);pointer-events:none}

/* ---- Cards ---- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:16px;margin-bottom:12px}
.card.tap{cursor:pointer;transition:transform .08s,border-color .15s}
.card.tap:active{transform:scale(.985)}
.row{display:flex;align-items:center;gap:12px}
.spread{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:12px}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--surface-2);
  color:var(--muted);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600}
.chip.accent{background:var(--accent-soft);color:var(--accent)}
.tag-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}

/* ---- Buttons ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border:none;border-radius:var(--radius-sm);padding:14px 18px;font-weight:600;
  font-family:var(--font-display);font-size:16px;
  background:var(--surface-2);color:var(--fg);width:100%}
.btn.primary{background:var(--accent);color:var(--accent-fg)}
.btn.ok{background:var(--ok);color:var(--ok-fg)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--fg)}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn:active{filter:brightness(.95)}
.btn.sm{padding:9px 12px;font-size:14px;width:auto;border-radius:9px}
.btn-stack{display:flex;flex-direction:column;gap:10px;margin-top:4px}

/* ---- Section heads ---- */
.sec-head{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 12px}
.sec-head h2{font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:48px 20px}
.empty .big{font-size:40px;margin-bottom:12px}

/* ---- Exercise item (detail) ---- */
.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);
  padding:14px;margin-bottom:10px;display:flex;align-items:center;gap:12px}
.ex .grip{color:var(--muted);font-size:20px;cursor:grab;touch-action:none;user-select:none}
.ex .body{flex:1;min-width:0}
.ex .name{font-weight:700}
.ex.drag{opacity:.4}
.ex.over{border-color:var(--accent)}
.ex.nodrag{margin-bottom:8px}
.ex.nodrag .grip{display:none}
/* bloco de Set no detalhe do treino */
.set-detail{border:1.5px solid var(--accent);border-radius:var(--radius-sm);padding:12px;margin-bottom:12px}
.set-detail-h{display:flex;align-items:center;justify-content:space-between;gap:8px;
  font-weight:700;font-size:14px;margin-bottom:10px}
.set-detail-h i{color:var(--accent2);margin-right:4px}
.set-detail .ex{background:var(--surface-2);margin-bottom:8px}

/* ---- Forms / modal ---- */
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;background:var(--surface-2);
  border:1px solid var(--line);border-radius:10px;padding:12px;color:var(--fg)}
.field textarea{min-height:64px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:none;
  align-items:flex-end;justify-content:center}
.overlay.open{display:flex;animation:fade .15s}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:20px 20px 0 0;
  padding:14px 20px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));
  max-height:80vh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  animation:slideup .22s ease;will-change:transform}
.sheet-grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:2px auto 14px;position:sticky;top:-2px}
@keyframes slideup{from{transform:translateY(100%)}to{transform:none}}
.sheet h2{font-size:18px;margin-bottom:16px}

/* ---- Session set tracking ---- */
.set-wrap{position:relative;overflow:hidden;border-top:1px solid var(--line)}
.set-wrap:first-of-type{border-top:none}
.set-del{position:absolute;top:6px;right:0;bottom:6px;width:64px;border:none;
  background:var(--danger);color:#fff;font-size:18px;display:grid;place-items:center;border-radius:12px}
.set-line{display:flex;align-items:center;gap:8px;padding:8px 14px 8px 0;position:relative;
  background:var(--surface);transition:transform .2s ease;touch-action:pan-y}
.set-wrap.open .set-line{transform:translateX(-72px)}
.set-no{width:30px;height:30px;border-radius:50%;background:var(--surface-2);
  display:grid;place-items:center;font-weight:700;font-size:13px;flex:0 0 auto}
.set-line input{width:100%;background:var(--surface-2);border:1px solid var(--line);
  border-radius:8px;padding:9px;text-align:center}
.set-line .u{font-size:12px;color:var(--muted);flex:0 0 auto}
.chk{width:38px;height:38px;flex:0 0 auto;border-radius:10px;border:2px solid var(--line);
  background:var(--surface);display:grid;place-items:center;font-size:18px;color:transparent}
.chk.on{background:var(--ok);border-color:var(--ok);color:var(--ok-fg)}
.set-line.done input{opacity:.55}
.col-head{display:flex;gap:8px;padding:0 0 4px 38px;font-size:11px;color:var(--muted);
  text-transform:uppercase;letter-spacing:.04em}
.col-head span{flex:1;text-align:center}
.col-head .sp{width:38px;flex:0 0 auto}
/* ---- Set (circuito) ---- */
.set-block{border:1.5px solid var(--accent)}
.set-round{background:var(--surface-2);border-radius:12px;padding:10px 12px;margin-bottom:9px}
.set-round-h{font-size:12px;font-weight:700;color:var(--accent2);margin-bottom:4px;letter-spacing:.03em}
.set-line.in-set{padding:6px 0}
.set-line.in-set .ex-name{flex:1 1 auto;min-width:0;font-size:14px;color:var(--fg);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.set-line.in-set input{max-width:58px;text-align:center}

/* ---- Rest timer bar ---- */
#rest{position:fixed;left:12px;right:12px;bottom:calc(var(--nav-h) + var(--nav-pad) + 18px);
  max-width:536px;margin:0 auto;background:var(--accent2);color:var(--accent2-fg);
  border-radius:14px;padding:12px 16px;display:none;align-items:center;gap:14px;z-index:30}
#rest.show{display:flex}
#rest.done{background:var(--ok);color:var(--ok-fg);animation:restpulse 1s ease-in-out infinite}
@keyframes restpulse{0%,100%{opacity:1}50%{opacity:.6}}
@media (prefers-reduced-motion:reduce){#rest.done{animation:none}}
#rest .t{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.02em}
#rest .lbl{flex:1;font-weight:700;font-size:13px;opacity:.9}
#rest button{background:rgba(0,0,0,.18);color:inherit;border:none;border-radius:8px;
  padding:8px 12px;font-weight:700;font-size:13px}

/* ---- History ---- */
.hist-date{font-weight:800;font-size:13px;color:var(--accent);text-transform:uppercase;
  letter-spacing:.04em;margin:18px 2px 8px}
.pr{color:var(--accent2);font-weight:700}
.progress-ex{font-weight:700;margin-bottom:4px}
.spark{display:flex;align-items:flex-end;gap:3px;height:44px;margin-top:8px}
.spark .bar{flex:1;background:var(--accent-soft);border-radius:3px 3px 0 0;min-height:4px;
  position:relative}
.spark .bar.last{background:var(--accent)}

.fab{position:fixed;right:16px;bottom:calc(var(--nav-h) + var(--nav-pad) + 22px);
  width:56px;height:56px;border-radius:50%;background:var(--accent);color:var(--accent-fg);
  border:none;font-size:28px;z-index:25;
  display:grid;place-items:center;max-width:560px}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 90px);transform:translateX(-50%);
  background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;
  font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
hr.sep{border:none;border-top:1px solid var(--line);margin:16px 0}
.link{color:var(--accent);font-weight:700;background:none;border:none;padding:0}

/* ---- Seletor Lista/Calendário ---- */
.seg{display:flex;gap:6px;background:var(--surface-2);padding:5px;border-radius:16px;margin-bottom:16px}
.seg button{flex:1;border:none;background:transparent;color:var(--muted);
  font-family:var(--font-display);font-weight:600;padding:10px;border-radius:12px;font-size:14px}
.seg button.on{background:var(--surface);color:var(--accent);box-shadow:var(--shadow)}

/* ---- Calendário ---- */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.cal-title{font-family:var(--font-display);font-weight:600;font-size:17px;text-transform:capitalize}
.cal-nav{width:36px;height:36px;border-radius:50%;border:none;background:var(--surface-2);color:var(--fg);font-size:20px;line-height:1}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-grid.wd{margin-bottom:6px}
.cal-wd{text-align:center;font-size:11px;font-weight:700;color:var(--muted)}
.cal-cell{aspect-ratio:1;min-width:0;display:grid;place-items:center;border-radius:50%;
  font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--fg)}
.cal-cell.empty{visibility:hidden}
.cal-cell.marked{background:var(--accent);color:var(--accent-fg);cursor:pointer}
.cal-cell.today{outline:2px solid var(--accent2);outline-offset:-2px}
.cal-cell.marked.today{outline-color:var(--fg)}
.cal-foot{text-align:center;margin-top:14px;font-size:13px;color:var(--muted);font-weight:700}

/* ---- Tela de login / status ---- */
#gate{position:fixed;top:0;left:0;right:0;bottom:0;height:calc(100dvh + env(safe-area-inset-bottom, 0px));z-index:100;background:var(--gate-bg);display:flex;
  flex-direction:column;align-items:center;justify-content:center;
  padding:24px;padding-top:calc(24px + env(safe-area-inset-top,0px));text-align:center}
#gate .logo{width:72px;height:72px;border-radius:20px;margin-bottom:18px;
  background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-size:34px}
#gate h1{font-size:24px;margin-bottom:6px}
#gate p.sub{color:var(--muted);font-size:14px;margin:0 0 26px}
#gate form{width:100%;max-width:340px;text-align:left}
#gate .msg{min-height:20px;font-size:13px;margin:4px 2px 10px;font-weight:600}
#gate .msg.err{color:var(--danger)} #gate .msg.ok{color:var(--ok)}
#gate .switch{margin-top:18px;font-size:14px;color:var(--muted)}
#gate .spin{font-size:14px;color:var(--muted)}
</style>
</head>
<body>
<div id="gate"><div class="spin">Carregando…</div></div>

<div id="app" hidden>
  <header>
    <button class="back" id="backBtn" hidden>‹ Voltar</button>
    <div class="title" id="hdrTitle">Meus Treinos</div>
    <button class="icon-btn" id="themeBtn" title="Tema" aria-label="Tema"><i class="fa-solid fa-circle-half-stroke" aria-hidden="true"></i></button>
  </header>

  <main>
    <!-- ===== Lista de treinos ===== -->
    <section class="view active" id="view-workouts"></section>
    <!-- ===== Detalhe do treino ===== -->
    <section class="view" id="view-detail"></section>
    <!-- ===== Sessão ativa ===== -->
    <section class="view" id="view-session"></section>
    <!-- ===== Histórico ===== -->
    <section class="view" id="view-history"></section>
    <!-- ===== Progresso ===== -->
    <section class="view" id="view-progress"></section>
    <!-- ===== Config ===== -->
    <section class="view" id="view-settings"></section>
  </main>

  <div id="rest">
    <span class="t" id="restT">00:00</span>
    <span class="lbl" id="restLbl">Descanso</span>
    <button id="restMinus">-15s</button>
    <button id="restSkip">Pular</button>
  </div>

  <nav>
    <div class="nav-ind" aria-hidden="true"></div>
    <button data-tab="workouts" class="active" aria-label="Treinos">
      <i class="fa-solid fa-dumbbell" aria-hidden="true"></i>
    </button>
    <button data-tab="history" aria-label="Histórico">
      <i class="fa-solid fa-clock-rotate-left" aria-hidden="true"></i>
    </button>
    <button data-tab="progress" aria-label="Progresso">
      <i class="fa-solid fa-chart-line" aria-hidden="true"></i>
    </button>
    <button data-tab="settings" aria-label="Ajustes">

<script>
  if('serviceWorker' in navigator){
    // auto-atualiza: quando uma versão nova assume, recarrega sozinho (sem reinstalar)
    let refreshing=false;
    navigator.serviceWorker.addEventListener('controllerchange', ()=>{
      if(refreshing) return; refreshing=true; location.reload();
    });
    window.addEventListener('load', async ()=>{
      try{
        const reg = await navigator.serviceWorker.register('sw.js');
        reg.addEventListener('updatefound', ()=>{
          const nw = reg.installing;
          if(nw) nw.addEventListener('statechange', ()=>{
            if(nw.state==='installed' && navigator.serviceWorker.controller) nw.postMessage&&nw.postMessage('skip');
          });
        });
        setInterval(()=>reg.update().catch(()=>{}), 60*60*1000); // procura update de hora em hora
      }catch(e){}
    });
  }
</script>
