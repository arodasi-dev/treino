services:
  treino-api:
    build: .
    container_name: treino-api
    restart: unless-stopped
    environment:
      TREINO_TOKEN: ${TREINO_TOKEN:?defina TREINO_TOKEN no arquivo .env}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://arodasi-dev.github.io}
    ports:
      # Só o próprio servidor alcança a porta; a tailnet chega via `tailscale serve`.
      - "127.0.0.1:${HOST_PORT:-8787}:8787"
    volumes:
      - ./dados:/data
      - ..:/site:ro        # os arquivos do app (só uma lista fixa é servida)
